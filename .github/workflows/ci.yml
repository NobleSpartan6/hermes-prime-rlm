name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HERMES_COMMIT: fcbd1076a93841fa88855acce810e342a5b78101

jobs:
  test-and-artifact:
    name: test + installed wheel (${{ matrix.os }}, py ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Configure Git test identity
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI Runner"
          git config --global init.defaultBranch main
      - name: Install pinned verification dependencies
        shell: bash
        run: |
          python -m pip install "pytest==9.1.1" "ruff==0.16.4" "build==1.5.0"
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth=1 origin "$HERMES_COMMIT"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "$HERMES_COMMIT"
          python -m pip install --editable "$RUNNER_TEMP/hermes-agent"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Desktop adapter overhead (synthetic, no model calls)
        run: python scripts/benchmark_desktop.py --samples 2000
      - name: Source-tree Plugin Doctor
        run: python -m hermes_cli.main plugins doctor . --ci
      - name: Build wheel and sdist
        run: python -m build
      - name: Install and exercise exact wheel
        shell: bash
        run: |
          WHEEL=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")))')
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          export HERMES_HOME="$RUNNER_TEMP/hermes-prime-artifact-home"
          mkdir -p "$HERMES_HOME"
          printf '_config_version: 39\nplugins:\n  enabled: [prime-rlm]\n  disabled: []\n  entries:\n    prime-rlm:\n      allow_tool_override: false\n' > "$HERMES_HOME/config.yaml"
          cd "$RUNNER_TEMP"
          python -c 'from hermes_cli.plugins import PluginManager; m=PluginManager(); m.discover_and_load(); p=m._plugins["prime-rlm"]; assert p.manifest.source=="entrypoint" and p.manifest.version=="0.2.0"; assert "prime_agent" in m._plugin_tool_names; assert "prime" in m._cli_commands; assert "prime-setup" in m._plugin_commands; assert p.commands_registered==["prime-setup"]; print("installed-entrypoint-discovery PASS"); m.unload()'
          python "$GITHUB_WORKSPACE/scripts/artifact_smoke.py"
