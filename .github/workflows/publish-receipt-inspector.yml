name: publish prepared receipt inspector

on:
  push:
    branches: ["feat/receipt-integrity-inspector"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Materialize and publish the exact prepared commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_BLOB_SHA: 645c60818a669e7a29b4133603c7611e94b52e6e
          BASE_SHA: 25322d4aa9e39077bd4463f85ce0144d86140da2
          EXPECTED_COMMIT_SHA: 168e5618e779b56460d58c6535df199c796d14e0
          TARGET_BRANCH: feat/receipt-integrity-inspector
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          blob_sha = os.environ["PATCH_BLOB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/git/blobs/{blob_sha}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          Path("/tmp/receipt-inspector.patch").write_bytes(
              base64.b64decode(payload["content"])
          )
          PY

          git config user.name "NobleSpartan6"
          git config user.email "2xeb@users.noreply.github.com"
          git config commit.gpgsign false
          git reset --hard "$BASE_SHA"
          git am --committer-date-is-author-date /tmp/receipt-inspector.patch
          git diff --check "$BASE_SHA"..HEAD

          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_COMMIT_SHA"

          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$GITHUB_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
