name: desktop-ui

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guided-launcher:
    name: guided launcher (${{ matrix.os }}, py ${{ matrix.python-version }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      HERMES_UI_REQUIRE_DISPLAY: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools only (no provider or Hermes runtime)
        run: python -m pip install "pytest==9.1.1" "ruff==0.16.4"
      - run: python -m ruff check .
      - name: Native form, consent, demo, and window tests (display required)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest --noconftest -q tests/test_desktop_workflow.py
          else
            python -m pytest --noconftest -q tests/test_desktop_workflow.py
          fi
