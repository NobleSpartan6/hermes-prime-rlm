[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-prime-rlm"
version = "0.1.1"
description = "Hermes Agent plugin: generate a detached candidate worktree with Prime Agent and record host-observed checks in a review receipt."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hermes-prime-rlm contributors" }]
keywords = ["hermes", "prime-agent", "rlm", "git", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]
# Runtime dependencies: standard library only (project rule). Nothing here.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.entry-points."hermes_agent.plugins"]
prime-rlm = "hermes_prime_rlm"

[tool.setuptools]
packages = ["hermes_prime_rlm"]
package-dir = { hermes_prime_rlm = "." }

[tool.setuptools.package-data]
hermes_prime_rlm = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: tests that intentionally exceed short timeouts (process-termination paths)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".git"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "S",   # flake8-bandit (shell=True / os.system bans live here)
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
]
ignore = [
  "S404", # subprocess import is the entire point of this plugin; misuse is banned by S602/S603 rules instead
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "S603", "S607", "E501"]
# demo*.py are local demonstration runners, not product code: they
# intentionally use partial executable paths ("git") and long strings.
"scripts/artifact_smoke.py" = ["S101", "S603"]
"scripts/demo.py" = ["S101", "S108", "S603", "S607", "E501", "E402"]
"scripts/demo_rlm.py" = ["S101", "S108", "S603", "S607", "E501", "E402"]
# launch_record.py is a local screen-recording helper (PowerShell strings).
"scripts/launch_record.py" = ["S101", "S603", "S607", "E501"]
# Fixture files are deliberately naive: run_tests.py is the buggy-style oracle
# the agent must make pass; generate_fixture.py uses seeded random for
# deterministic data generation, not cryptography.
"examples/*" = ["S101", "SIM115", "I001", "F401", "E501"]
"scripts/generate_fixture.py" = ["S311"]
